# Native repository settings, maintained by hand; agent-config generates hooks and subagents only.
# Keep equivalent rules in .codex/rules/tao.rules, .claude/settings*.json and
# .cursor/permissions.json synchronized in the same change (see agent-instructions).
# Model defaults follow agents/skills/delegation/SKILL.md. Setup does not install
# machine-local Git grants; named host operations require harness approval.

default_permissions = "tao-workspace"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# Live retrieval so agents can research language, tooling, and dependency questions
# without an approval round-trip.
web_search = "live"

# Required for the per-profile domain rules below to be enforced.
[features]
network_proxy = true

# Delegation defaults. The model is the standard tier of the routing table in
# agents/skills/delegation/SKILL.md, which is the one place this repository spells a model name.
[agents]
enabled = true
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 5

[permissions.tao-review]
extends = ":read-only"
description = "Tao review: inspect the worktree and reference repository without editing them."

[permissions.tao-review.filesystem]
# The previous repository is reference material only (see AGENTS.md).
"~/code/tao-lang" = "read"
"~/.aws/**" = "deny"
"~/.config/gh/**" = "deny"
"~/.ssh/**" = "deny"

[permissions.tao-review.filesystem.":workspace_roots"]
# Keep the patterns narrow so they do not match unrelated repository files.
"**/.env" = "deny"
"**/.env.*" = "deny"

[permissions.tao-review.network]
enabled = true


# Allowlist-first: shell egress is limited to the hosts Tao's toolchain and research need.
[permissions.tao-review.network.domains]
"**.anthropic.com" = "allow"
"**.appstoreconnect.apple.com" = "allow"
"**.cachix.org" = "allow"
"**.developer.apple.com" = "allow"
"**.expo.dev" = "allow"
"**.expo.io" = "allow"
"**.github.com" = "allow"
"**.githubusercontent.com" = "allow"
"**.itunes.apple.com" = "allow"
"**.nodejs.org" = "allow"
"**.npmjs.org" = "allow"
"**.openai.com" = "allow"
"appleid.apple.com" = "allow"
"archive.ubuntu.com" = "allow"
"auth.docker.io" = "allow"
"cache.nixos.org" = "allow"
"cdn.cocoapods.org" = "allow"
"contentdelivery.apple.com" = "allow"
"devimages-cdn.apple.com" = "allow"
"electrobun-artifacts.blackboard.sh" = "allow"
"exp.host" = "allow"
"gsa.apple.com" = "allow"
"hutch.blackboard.sh" = "allow"
"idmsa.apple.com" = "allow"
"production.cloudfront.docker.com" = "allow"
