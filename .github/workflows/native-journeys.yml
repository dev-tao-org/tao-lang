name: Native Tao journeys

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: '["ios","android"]'
      shards:
        type: string
        default: '[1]'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journeys:
    name: Tao journeys (${{ matrix.platform }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms || '["ios","android"]') }}
        shard: ${{ fromJSON(inputs.shards || '[1]') }}
    env:
      TERMINAL_OUTPUT: '1'
      TAO_SETUP_STORAGE: 'false'
      EXPO_GO_VERSION: 57.0.9
      EXPO_GO_EXTENSION: ${{ matrix.platform == 'ios' && 'tar.gz' || 'apk' }}
      EXPO_GO_DIGEST: ${{ matrix.platform == 'ios' && 'faff18034c9f3504ea4786f07350efab604610c61cfcabd0f2191fc4416a7614' || '14c18828a3d04e43922245920bd941b978fd1c7a5aec88a0188032f0bb4972ce' }}
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the Android emulator data partition
        if: matrix.platform == 'android' && runner.environment == 'github-hosted'
        run: |
          # The hosted NDKs are unused because this job installs a prebuilt Expo Go APK.
          sudo rm -rf -- "${ANDROID_HOME:?Missing Android SDK}/ndk"
      - uses: ./.config/nix
        if: matrix.platform == 'android'
      - uses: cachix/install-nix-action@v31
        if: matrix.platform == 'ios'
      - uses: nix-community/cache-nix-action@v7
        if: matrix.platform == 'ios'
        with:
          primary-key: tao-ios-journey-tools-v1-${{ runner.arch }}-${{ hashFiles('devenv.lock', '.config/nix/portable-profile.nix', '.config/nix/toolchain-packages.nix') }}
          paths: |
            ~/.cache/nix
            .devenv/ci-tools
      - name: Make restored tool caches writable
        if: matrix.platform == 'ios'
        run: |
          for cache_directory in .devenv "$HOME/.cache"; do
            if [ -d "$cache_directory" ]; then
              sudo chown -hR "$(id -u):$(id -g)" "$cache_directory"
            fi
          done
      - uses: cachix/cachix-action@v16
        if: matrix.platform == 'ios'
        with:
          name: devenv
      - name: Prepare the locked macOS CLI tools
        if: matrix.platform == 'ios'
        run: |
          # Xcode and the simulator come from the runner image.
          profile="$PWD/.devenv/ci-tools"
          mkdir -p .devenv
          if [ ! -x "$profile/bin/bun" ]; then
            nix-build .config/nix/portable-profile.nix --out-link "$profile"
          fi
          printf '%s\n' "$profile/bin" >> "$GITHUB_PATH"
          printf 'DEVENV_ROOT=%s\nTAO_DEVENV=1\n' "$PWD" >> "$GITHUB_ENV"
      - name: Restore workspace downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/dprint
          key: tao-typescript-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock') }}-${{ hashFiles('ts/bun.lock', 'ts/**/package.json', '.config/dprint.jsonc') }}
          restore-keys: |
            tao-typescript-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock') }}-
      - name: Install the locked workspace
        run: ./dev setup
      - name: Identify the Android SDK package paths
        if: matrix.platform == 'android'
        id: android
        run: |
          printf 'image=%s\n' "${ANDROID_HOME:?Missing Android SDK}/system-images/android-36/google_apis/x86_64" >> "$GITHUB_OUTPUT"
          printf 'emulator=%s\n' "$ANDROID_HOME/emulator" >> "$GITHUB_OUTPUT"
      - name: Restore the Android emulator and system image
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.android.outputs.emulator }}
            ${{ steps.android.outputs.image }}
          key: tao-android-sdk-v1-emulator-google-apis-36-x86_64
      - name: Install the Android emulator and require hardware acceleration
        if: matrix.platform == 'android'
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          command_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$ANDROID_HOME/emulator/emulator" ] || [ ! -f "${{ steps.android.outputs.image }}/source.properties" ]; then
            "$command_tools/sdkmanager" emulator 'system-images;android-36;google_apis;x86_64'
          fi
          "$ANDROID_HOME/emulator/emulator" -accel-check
          df -h "$PWD"
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            cores=$(nproc)
            memory=3072
            if [ "$cores" -ge 4 ]; then
              cores=4
              memory=4096
            fi
            printf 'Android emulator resources: %s cores, %s MiB RAM\n' "$cores" "$memory"
            printf 'TAO_ANDROID_JOURNEY_CORES=%s\nTAO_ANDROID_JOURNEY_MEMORY=%s\n' "$cores" "$memory" >> "$GITHUB_ENV"
          fi
          printf '%s\n' "$command_tools" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Identify the Xcode toolchain
        if: matrix.platform == 'ios'
        id: xcode
        run: |
          xcode=$(xcodebuild -version)
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-build-version)
          runtimes=$(xcrun simctl list runtimes --json | jq -cS '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))) | {identifier, buildversion}] | sort_by(.identifier)')
          printf 'identity=%s\n' "$(printf '%s\n' "$xcode" "$sdk" "$runtimes" | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore the WebDriverAgent build
        if: matrix.platform == 'ios'
        uses: actions/cache@v4
        with:
          # Xcode's CompilationCache database changes size during the post-job archive.
          path: |
            .artifacts/cache/native-journeys/wda/*/Build
            .artifacts/cache/native-journeys/wda/*/ModuleCache.noindex
            .artifacts/cache/native-journeys/wda/*/SDKStatCaches.noindex
          key: tao-wda-v3-${{ runner.arch }}-${{ steps.xcode.outputs.identity }}-${{ hashFiles('ts/bun.lock') }}
      - name: Restore the Expo Go runtime
        uses: actions/cache@v4
        with:
          path: .artifacts/cache/native-journeys/expo-go
          key: tao-expo-go-v1-${{ matrix.platform }}-${{ env.EXPO_GO_DIGEST }}
      - name: Verify the runtime download
        run: |
          set -euo pipefail
          directory="$PWD/.artifacts/cache/native-journeys/expo-go"
          mkdir -p "$directory"
          name="Expo-Go-$EXPO_GO_VERSION.$EXPO_GO_EXTENSION"
          archive="$directory/$name"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 3 --output "$archive" "https://github.com/expo/expo-go-releases/releases/download/Expo-Go-$EXPO_GO_VERSION/$name"
          fi
          printf '%s  %s\n' "$EXPO_GO_DIGEST" "$archive" | shasum -a 256 -c -
          if [ "$EXPO_GO_EXTENSION" = tar.gz ]; then
            binary="$RUNNER_TEMP/Expo-Go.app"
            mkdir "$binary"
            tar -xzf "$archive" -C "$binary"
          else
            binary="$archive"
          fi
          printf 'EXPO_GO_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Run native test shard
        env:
          PLATFORM: ${{ matrix.platform }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards || '[1]' }}
        run: |
          shard_count=$(jq -er length <<< "$SHARDS")
          ./agent test --platform "$PLATFORM" --expo-go "$EXPO_GO_BINARY" --shard "$SHARD/$shard_count" --yes
      - name: Ensure validation kept tracked files unchanged
        run: git diff --exit-code
      - name: Keep native driver and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-journeys-${{ matrix.platform }}-${{ matrix.shard }}
          path: |
            .artifacts/logs/dev/*.log
            .artifacts/logs/agent/*.log
            .artifacts/logs/setup/*.log
            .artifacts/logs/native-journeys/*/*.log
            .artifacts/logs/native-journeys/*.xml
            .artifacts/logs/native-journeys/*.png
            .artifacts/logs/native-journeys/*/*.png
          if-no-files-found: warn
