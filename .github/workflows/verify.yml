name: Verify

# Required CI validates the new workspace. Legacy host workflows remain manual reference tools.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      typescript_shards:
        description: TypeScript shard count
        type: number
        default: 3
      ios_shards:
        description: iOS shard count
        type: number
        default: 2
      android_shards:
        description: Android shard count
        type: number
        default: 2

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan Verify shards
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      portable: ${{ steps.widths.outputs.portable }}
      ios: ${{ steps.widths.outputs.ios }}
      android: ${{ steps.widths.outputs.android }}
    steps:
      - id: widths
        env:
          TYPESCRIPT_WIDTH: ${{ inputs.typescript_shards || 3 }}
          IOS_WIDTH: ${{ inputs.ios_shards || 2 }}
          ANDROID_WIDTH: ${{ inputs.android_shards || 2 }}
        run: |
          [[ "$TYPESCRIPT_WIDTH" =~ ^[1-8]$ && "$IOS_WIDTH" =~ ^[1-7]$ && "$ANDROID_WIDTH" =~ ^[1-7]$ ]]
          portable=$(jq -cn --argjson n "$TYPESCRIPT_WIDTH" '["check","web"] + [range(1; $n + 1)]')
          ios=$(jq -cn --argjson n "$IOS_WIDTH" '[range(1; $n + 1)]')
          android=$(jq -cn --argjson n "$ANDROID_WIDTH" '[range(1; $n + 1)]')
          printf 'portable=%s\nios=%s\nandroid=%s\n' "$portable" "$ios" "$android" >> "$GITHUB_OUTPUT"


  typescript:
    needs: plan
    uses: ./.github/workflows/typescript.yml
    with:
      lanes: ${{ needs.plan.outputs.portable }}

  ios:
    needs: plan
    uses: ./.github/workflows/native-journeys.yml
    with:
      platforms: '["ios"]'
      shards: ${{ needs.plan.outputs.ios }}

  android:
    needs: plan
    uses: ./.github/workflows/native-journeys.yml
    with:
      platforms: '["android"]'
      shards: ${{ needs.plan.outputs.android }}

  cla:
    name: Contributor agreement
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: read
      pull-requests: write
    env:
      CLA_SENTENCE: I have read the Tao Contributor License Agreement, version 1.0, and I agree to it.
      MARKER: '<!-- tao-cla -->'
    steps:
      - name: Check the author has accepted the agreement
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          # The repository belongs to an organization, so the maintainer is named rather than read
          # from the owner, which is now the organization's login.
          MAINTAINER: marcuswestin
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Each check reads a whole value first: grep -q in a pipeline would end it early and fail it.
          signed() { grep -qiF -- "$CLA_SENTENCE" <<<"$1"; }
          comments_by() {
            gh api --paginate "repos/$REPO/issues/$1/comments" --jq ".[] | select(.user.login == \"$AUTHOR\") | .body"
          }
          # The maintainer holds the rights already.
          accepted=false
          if [ "$AUTHOR" = "$MAINTAINER" ]; then
            accepted=true
          # This pull request's description, or a comment on it, by its author.
          elif signed "$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""')" || signed "$(comments_by "$NUMBER")"; then
            accepted=true
          else
            # An earlier pull request where the author accepted it.
            for other in $(gh api -X GET search/issues \
                -f q="repo:$REPO is:pr involves:$AUTHOR \"$CLA_SENTENCE\"" --jq '.items[].number'); do
              body=$(gh api "repos/$REPO/pulls/$other" --jq "select(.user.login == \"$AUTHOR\") | .body")
              if signed "$body" || signed "$(comments_by "$other")"; then
                accepted=true
                break
              fi
            done
          fi

          if [ "$accepted" = true ]; then
            echo "@$AUTHOR has accepted the agreement."
            exit 0
          fi

          echo "::error::@$AUTHOR has not accepted CLA.md. Post the agreement sentence as a comment on this pull request, then push or re-run this job."
          # Explain once on the pull request; a fork's read-only token cannot, and this log says it then.
          existing=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" --jq '.[].body')
          if ! grep -qF -- "$MARKER" <<<"$existing"; then
            gh pr comment "$NUMBER" --repo "$REPO" --body "$MARKER
          Thank you for the pull request, @$AUTHOR. Before it can be merged, please read the
          [Tao Contributor License Agreement](https://github.com/$REPO/blob/main/CLA.md) and, if you agree,
          post this sentence as a comment, exactly as written:

          > $CLA_SENTENCE

          Then push again or ask a maintainer to re-run the \"Contributor agreement\" check. It covers this
          and every later contribution. You keep the copyright in your work; the agreement lets the
          maintainer license Tao, your contribution included, under any terms." \
              || echo "::warning::Could not post the explanation on the pull request; the token is read-only."
          fi
          exit 1

  verify:
    name: Verify
    needs: [typescript, ios, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require web, iOS and Android verification to pass
        env:
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          IOS_RESULT: ${{ needs.ios.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          if [ "$TYPESCRIPT_RESULT" != success ] || [ "$IOS_RESULT" != success ] || [ "$ANDROID_RESULT" != success ]; then
            echo "Web and TypeScript: $TYPESCRIPT_RESULT. iOS: $IOS_RESULT. Android: $ANDROID_RESULT."
            exit 1
          fi
