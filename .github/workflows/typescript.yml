name: TypeScript workspace

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript setup, check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TERMINAL_OUTPUT: '1'
      # Build/test jobs do not publish evidence or have cross-repository archive credentials.
      TAO_SETUP_STORAGE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: tao-typescript-tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock', '.config/nix/*.nix', '.config/bootstrap-tao-dev-env') }}
          restore-prefixes-first-match: tao-typescript-tools-v2-${{ runner.os }}-${{ runner.arch }}-
          paths: |
            ~/.cache/nix
            .devenv/portable-generations
            .devenv/profile
          gc-max-store-size-linux: 6G
      - name: Make restored caches writable
        run: |
          for cache_directory in .devenv "$HOME/.cache"; do
            if [ -d "$cache_directory" ]; then
              sudo chown -hR "$(id -u):$(id -g)" "$cache_directory"
            fi
          done
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      # This job needs the pinned CLI tools, not the full Android SDK/NDK development shell.
      - name: Prepare portable TypeScript tools
        run: ./.config/bootstrap-tao-dev-env --tools-only
      - name: Restore dependency and formatter downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/dprint
          key: tao-typescript-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock') }}-${{ hashFiles('ts/bun.lock', 'ts/**/package.json', '.config/dprint.jsonc') }}
          restore-keys: |
            tao-typescript-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock') }}-
      - name: Install workspace dependencies
        run: ./dev setup
      - name: Check workspace
        run: ./agent check
      - name: Test workspace
        # Browser/Metro and compiler integration tests share this runner's CPU and memory.
        run: ./agent test --serial --yes
      - name: Ensure validation kept tracked files unchanged
        run: git diff --exit-code
      - name: Upload logs and test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-logs
          path: .artifacts/logs/
          if-no-files-found: ignore
