name: TypeScript workspace

on:
  workflow_call:
    inputs:
      lanes:
        type: string
        default: '["check","web",1,2,3]'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Portable ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(inputs.lanes || '["check","web",1,2,3]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TERMINAL_OUTPUT: '1'
      # Build/test jobs do not publish evidence or have cross-repository archive credentials.
      TAO_SETUP_STORAGE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.config/nix
      - name: Restore dependency and formatter downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/dprint
          key: tao-typescript-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock') }}-${{ hashFiles('ts/bun.lock', 'ts/**/package.json', '.config/dprint.jsonc') }}
          restore-keys: |
            tao-typescript-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('devenv.lock') }}-
      - name: Install workspace dependencies
        run: ./dev setup
      - name: Check workspace
        if: matrix.lane == 'check'
        run: ./agent check
      - name: Test web journeys
        if: matrix.lane == 'web'
        run: ./agent test --suite web --serial --yes
      - name: Test TypeScript shard
        if: matrix.lane != 'check' && matrix.lane != 'web'
        env:
          SHARD: ${{ matrix.lane }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: ./agent test --suite typescript --shard "$SHARD/$((JOB_TOTAL - 2))" --yes
      - name: Ensure validation kept tracked files unchanged
        run: git diff --exit-code
      - name: Upload logs and test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-logs-${{ matrix.lane }}
          path: .artifacts/logs/
          if-no-files-found: ignore
